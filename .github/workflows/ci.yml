name: ShopFit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend FastAPI & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install Python dependencies
        run: pip install -r requirements-lock.txt
      - name: Compile Python modules
        run: python -m py_compile app/main.py app/db.py app/tryon.py app/sizing.py app/fitting_routes.py app/insights.py
      - name: Run Backend Pytest Suite
        run: pytest tests -q

  mobile-checks:
    name: Mobile Expo TypeScript, Lint & Web Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - name: Install NPM dependencies
        run: npm ci
      - name: TypeScript Strict Check
        run: npm run typecheck
      - name: Expo ESLint Check
        run: npm run lint
      - name: Verify Web Production Bundle
        run: npx expo export --platform web
